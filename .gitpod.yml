image:
  file: .gitpod.dockerfile
tasks:
  - name: Continuous Build
    command: npm install -g pnpm concurrently && go install github.com/air-verse/air@latest && cd /workspace/xbvr && go generate && go get && pnpm install && pnpm dev
ports:
  - port: 9999
    onOpen: open-preview
  - port: 1338
    onOpen: ignore
  - port: 9998
    onOpen: ignore
