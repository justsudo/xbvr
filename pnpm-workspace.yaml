# pnpm v12 project configuration (https://pnpm.io/settings)
packages:
  - '.'

# Disallow arbitrary build/lifecycle scripts on dependencies for supply-chain security
strictDepBuilds: false

allowBuilds:
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-free': false
  '@fortawesome/fontawesome-svg-core': false
  '@parcel/watcher': false
  bufferutil: false
  core-js: false
  es5-ext: false
  unrs-resolver: false
  utf-8-validate: false
  vue-gallery: false
  yorkie: false
