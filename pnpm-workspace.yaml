# pnpm v12 project configuration (https://pnpm.io/settings)
packages:
  - '.'

# Disallow arbitrary build/lifecycle scripts on dependencies for supply-chain security
strictDepBuilds: false

allowBuilds:
  '@fortawesome/fontawesome-common-types': false
  '@fortawesome/fontawesome-free': false
  '@fortawesome/fontawesome-svg-core': false
  '@parcel/watcher': false
  bufferutil: false
  core-js: false
  es5-ext: false
  unrs-resolver: false
  utf-8-validate: false
  vue-gallery: false
  yorkie: false

minimumReleaseAgeExclude:
  - qs@6.15.4
  - node-forge@1.4.1

overrides:
  cross-spawn@<6.0.6: ^6.0.6
  joi@>=17.1.1 <17.13.9: ^17.13.9
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  msgpack5@<6.1.0: ^6.1.0
  msgpack5@>=4.1.0 <6.1.0: ^6.1.0
  node-forge@<=1.4.2: ^1.4.3
  node-forge@>=0.1.2 <=1.4.2: ^1.4.3
  postcss@<8.4.31: ^8.4.31
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  serialize-javascript@<7.1.3: ^7.1.3
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  three@<0.125.0: ^0.125.0
  uuid@<11.1.1: ^11.1.1
